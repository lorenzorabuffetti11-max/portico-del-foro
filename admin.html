<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin · Pórtico del Foro</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' fill='%231A2E4A' rx='8'/><line x1='16' y1='16' x2='48' y2='48' stroke='white' stroke-width='4' stroke-linecap='round'/><line x1='48' y1='16' x2='16' y2='48' stroke='white' stroke-width='4' stroke-linecap='round'/><circle cx='32' cy='32' r='7' fill='%23E63946'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--c-navy:#1A2E4A;--c-coral:#E63946;--c-bg:#FAFAFA;--c-text:#1A2E4A;--c-text-2:#5A6B82;--c-border:#E5E8ED;--c-error:#C0392B;--f-display:'Fraunces',Georgia,serif;--f-body:'Inter',-apple-system,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--f-body);color:var(--c-text);background:var(--c-bg);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;-webkit-font-smoothing:antialiased}
.login-card{background:white;border:1px solid var(--c-border);border-radius:14px;padding:48px 40px;width:100%;max-width:420px;box-shadow:0 10px 40px rgba(26,46,74,0.08)}
.brand{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:32px}
.brand-mark{width:44px;height:44px}
.brand-text{display:flex;flex-direction:column;line-height:1}
.brand-name{font-family:var(--f-display);font-weight:600;font-size:26px;color:var(--c-navy);letter-spacing:-0.01em}
.brand-tag{font-size:9px;font-weight:500;letter-spacing:0.18em;color:var(--c-text-2);text-transform:uppercase;margin-top:4px}
.eyebrow{font-size:11px;font-weight:500;letter-spacing:0.2em;text-transform:uppercase;color:var(--c-coral);text-align:center;margin-bottom:8px}
h1{font-family:var(--f-display);font-weight:600;font-size:28px;color:var(--c-navy);text-align:center;margin-bottom:32px;letter-spacing:-0.01em}
.fg{margin-bottom:18px}
.fg label{display:block;font-size:13px;font-weight:500;color:var(--c-navy);margin-bottom:6px}
.fg input{width:100%;border:1px solid var(--c-border);border-radius:6px;padding:12px 14px;font-family:var(--f-body);font-size:14px;color:var(--c-text);background:white;transition:border-color 0.15s}
.fg input:focus{outline:none;border-color:var(--c-coral)}
.btn{width:100%;background:var(--c-coral);color:white;border:none;padding:14px;border-radius:6px;font-family:var(--f-body);font-size:14px;font-weight:500;cursor:pointer;transition:background 0.15s;margin-top:8px}
.btn:hover{background:#d12d3a}
.btn:disabled{background:#a0a8b3;cursor:not-allowed}
.alert{padding:12px 14px;border-radius:6px;font-size:13px;margin-bottom:16px}
.alert-error{background:rgba(192,57,43,0.06);border:1px solid rgba(192,57,43,0.2);color:var(--c-error)}
.back-link{display:block;text-align:center;margin-top:24px;font-size:13px;color:var(--c-text-2);text-decoration:none;transition:color 0.15s}
.back-link:hover{color:var(--c-coral)}
</style>
</head>
<body>

<div class="login-card">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 64 64"><rect width="64" height="64" fill="#1A2E4A" rx="8"/><line x1="16" y1="16" x2="48" y2="48" stroke="white" stroke-width="4" stroke-linecap="round"/><line x1="48" y1="16" x2="16" y2="48" stroke="white" stroke-width="4" stroke-linecap="round"/><circle cx="32" cy="32" r="7" fill="#E63946"/></svg>
    <div class="brand-text">
      <div class="brand-name">Pórtico</div>
      <div class="brand-tag">del Foro</div>
    </div>
  </div>

  <div class="eyebrow">Acceso restringido</div>
  <h1>Panel admin</h1>

  <div id="alert-box"></div>

  <form id="login-form">
    <div class="fg">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="email" autofocus>
    </div>
    <div class="fg">
      <label for="password">Contraseña</label>
      <input type="password" id="password" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn" id="submit-btn">Ingresar</button>
  </form>

  <a href="/" class="back-link">← Volver al sitio público</a>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SB_URL = 'https://brbbccvsrcfnsbbfkirm.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJyYmJjY3ZzcmNmbnNiYmZraXJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxNDY1NjIsImV4cCI6MjA5MzcyMjU2Mn0.zGdseaJ5y9DcypdHKmIqWKOPoFfbdWky_Tc1OQpClEg';
const sb = createClient(SB_URL, SB_KEY);

// Si ya está logueado, redirigir directo al panel
const { data: { session } } = await sb.auth.getSession();
if (session) {
  window.location.href = '/panel.html';
}

const form = document.getElementById('login-form');
const submitBtn = document.getElementById('submit-btn');
const alertBox = document.getElementById('alert-box');

function showError(msg) {
  alertBox.innerHTML = '<div class="alert alert-error">' + msg + '</div>';
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  alertBox.innerHTML = '';
  submitBtn.disabled = true;
  submitBtn.textContent = 'Ingresando…';

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    
    if (error) {
      showError('Email o contraseña incorrectos.');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Ingresar';
      return;
    }

    // Verificar que el usuario sea admin activo
    const { data: adminData, error: adminError } = await sb
      .from('admin_users')
      .select('id, full_name, role, active')
      .eq('auth_user_id', data.user.id)
      .eq('active', true)
      .single();

    if (adminError || !adminData) {
      await sb.auth.signOut();
      showError('Esta cuenta no tiene permisos de administración.');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Ingresar';
      return;
    }

    // Login exitoso, redirigir al panel
    window.location.href = '/panel.html';
  } catch (err) {
    showError('Error inesperado: ' + (err.message || 'desconocido'));
    submitBtn.disabled = false;
    submitBtn.textContent = 'Ingresar';
  }
});
</script>

</body>
</html>
